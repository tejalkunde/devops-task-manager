name: Build and Push Images

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: filter
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --name-only HEAD^ HEAD | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/tejalkunde/devops-task-manager-backend:${{ github.sha }}
            ghcr.io/tejalkunde/devops-task-manager-backend:latest

      - name: Update Backend Kubernetes image
        shell: bash
        run: |
          sed -i "s|ghcr.io/tejalkunde/devops-task-manager-backend:.*|ghcr.io/tejalkunde/devops-task-manager-backend:${{ github.sha }}|" k8s/backend-deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/backend-deployment.yaml
          git commit -m "Update backend image to ${{ github.sha }} [skip ci]"
          git push

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/tejalkunde/devops-task-manager-frontend:${{ github.sha }}
            ghcr.io/tejalkunde/devops-task-manager-frontend:latest

      - name: Update Frontend Kubernetes image
        shell: bash
        run: |
          sed -i "s|ghcr.io/tejalkunde/devops-task-manager-frontend:.*|ghcr.io/tejalkunde/devops-task-manager-frontend:${{ github.sha }}|" k8s/frontend-deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/frontend-deployment.yaml
          git commit -m "Update frontend image to ${{ github.sha }} [skip ci]"
          git push