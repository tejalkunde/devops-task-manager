name: Build and Push Images

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/tejalkunde/devops-task-manager-backend:${{ github.sha }}
            ghcr.io/tejalkunde/devops-task-manager-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/tejalkunde/devops-task-manager-frontend:${{ github.sha }}
            ghcr.io/tejalkunde/devops-task-manager-frontend:latest

      - name: Update Kubernetes image tags
        shell: bash
        run: |
          sed -i "s|ghcr.io/tejalkunde/devops-task-manager-backend:.*|ghcr.io/tejalkunde/devops-task-manager-backend:${{ github.sha }}|" k8s/backend-deployment.yaml

          sed -i "s|ghcr.io/tejalkunde/devops-task-manager-frontend:.*|ghcr.io/tejalkunde/devops-task-manager-frontend:${{ github.sha }}|" k8s/frontend-deployment.yaml

      - name: Commit Kubernetes manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "Update image tags to ${{ github.sha }} [skip ci]"
            git push
          fi