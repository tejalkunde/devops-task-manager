apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-frontend
  namespace: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-frontend
  template:
    metadata:
      labels:
        app: task-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/tejalkunde/devops-task-manager-frontend:d18eee6e5c357ac64a9a561ad42b1922856dd7e2
          ports:
            - containerPort: 80