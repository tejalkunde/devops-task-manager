apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-backend
  namespace: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-backend
  template:
    metadata:
      labels:
        app: task-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/tejalkunde/devops-task-manager-backend:d18eee6e5c357ac64a9a561ad42b1922856dd7e2
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"